
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Gavindu Achintha - I build systems that sense, think and act">
  <style>
    .name { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-size: 46px; font-weight: 600; fill: #F5F7FA; letter-spacing: 0.01em; }
    .tag { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; font-size: 15px; fill: #65D6AD; letter-spacing: 0.04em; }
    .meta { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; font-size: 12.5px; fill: #A7B0BC; letter-spacing: 0.12em; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .p1 { animation: pulse 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation: pulse 3s ease-out infinite 1s; transform-box: fill-box; transform-origin: center; }
    .p3 { animation: pulse 3s ease-out infinite 2s; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { opacity: .55; transform: scale(.35) } 100% { opacity: 0; transform: scale(1) } }
  </style>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151B21"/>
      <stop offset="100%" stop-color="#101318"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="100%" stop-color="#65D6AD"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9F43" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#65D6AD" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="199" rx="14" fill="url(#panel)" stroke="#343B46" stroke-opacity="0.9"/>

  <!-- Signal trace -->
  <path d="M520 100 H600 l12 -18 12 18 H690 l10 -12 10 12 H745"
        fill="none" stroke="url(#signal)" stroke-width="1.6"/>
  <circle cx="600" cy="100" r="2" fill="#FF9F43"/>
  <circle cx="690" cy="100" r="2" fill="#65D6AD"/>

  <!-- Transmitting node -->
  <g transform="translate(790 100)">
    <circle r="40" fill="none" stroke="#FF9F43" stroke-width="1.4" class="p1"/>
    <circle r="40" fill="none" stroke="#65D6AD" stroke-width="1.4" class="p2"/>
    <circle r="40" fill="none" stroke="#FF9F43" stroke-width="1.4" class="p3"/>
    <circle r="25" fill="none" stroke="#65D6AD" stroke-opacity=".3" stroke-width="1"/>
    <circle r="5" fill="#FF9F43"/>
    <circle r="2" fill="#F5F7FA"/>
  </g>

  <text x="48" y="78" class="name">Gavindu Achintha</text>
  <rect x="48" y="96" width="150" height="2" rx="1" fill="url(#rule)"/>

  <text x="48" y="126" class="tag">I build systems that sense, think, and act<tspan class="cursor" dx="4">_</tspan></text>
  <text x="48" y="152" class="meta">APPLIED ELECTRONICS  ·  EMBEDDED &amp; EDGE AI  ·  COLOMBO, SRI LANKA</text>
</svg>
