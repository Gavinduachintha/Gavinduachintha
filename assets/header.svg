<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Gavindu Achintha - I build systems that sense, think and act">
  <style><![CDATA[
    .name { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-size: 46px; font-weight: 600; fill: #f3f7f4; letter-spacing: 0.01em; }
    .tag  { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; font-size: 15px; fill: #5fbc8a; letter-spacing: 0.04em; }
    .meta { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; font-size: 12.5px; fill: #7e8b85; letter-spacing: 0.12em; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .p1 { animation: pulse 3s ease-out infinite; }
    .p2 { animation: pulse 3s ease-out infinite; animation-delay: 1s; }
    .p3 { animation: pulse 3s ease-out infinite; animation-delay: 2s; }
    @keyframes pulse { 0% { opacity: 0.55; transform: scale(0.35) } 100% { opacity: 0; transform: scale(1) } }
  ]]></style>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1411"/>
      <stop offset="100%" stop-color="#080b0a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fbc8a"/>
      <stop offset="100%" stop-color="#5fbc8a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="199" rx="14" fill="url(#panel)" stroke="#5fbc8a" stroke-opacity="0.22"/>

  <!-- signal trace running into the transmitting node -->
  <path d="M520 100 H600 l12 -18 12 18 H690 l10 -12 10 12 H745" fill="none" stroke="#5fbc8a" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- transmitting node -->
  <g transform="translate(790 100)">
    <circle r="40" fill="none" stroke="#5fbc8a" stroke-width="1.5" class="p1"/>
    <circle r="40" fill="none" stroke="#5fbc8a" stroke-width="1.5" class="p2"/>
    <circle r="40" fill="none" stroke="#5fbc8a" stroke-width="1.5" class="p3"/>
    <circle r="5" fill="#5fbc8a"/>
  </g>

  <text x="48" y="78" class="name">Gavindu Achintha</text>
  <rect x="48" y="96" width="150" height="2" fill="url(#rule)"/>

  <text x="48" y="126" class="tag">I build systems that sense, think, and act<tspan class="cursor" dx="4">_</tspan></text>
  <text x="48" y="152" class="meta">APPLIED ELECTRONICS  &#183;  EMBEDDED &amp; EDGE AI  &#183;  COLOMBO, SRI LANKA</text>
</svg>
