<svg xmlns="http://www.w3.org/2000/svg" width="440" height="168" viewBox="0 0 440 168" role="img" aria-label="Neo Stick - a pocket ESP32-S3 tool with its own menu-driven interface">
  <style><![CDATA[
    .t { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 600; fill: #f3f7f4; }
    .k { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #5fbc8a; letter-spacing: 0.14em; }
    .d { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; fill: #9fb0a8; }
    .c { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #5fbc8a; }
  ]]></style>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="#0d1411" stroke="#5fbc8a" stroke-opacity="0.22"/>
  <text x="22" y="38" class="t">Neo Stick</text>
  <text x="418" y="36" class="k" text-anchor="end">EMBEDDED &#183; TOOL</text>
  <rect x="22" y="50" width="396" height="1" fill="#5fbc8a" fill-opacity="0.16"/>
  <text x="22" y="78" class="d">A pocket ESP32-S3 tool with its own menu-driven</text>
  <text x="22" y="98" class="d">interface: Wi-Fi scanner, BLE tools, remote.</text>
  <g>
    <rect x="22" y="122" width="68" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
    <text x="56" y="137" class="c" text-anchor="middle">ESP32-S3</text>
    <rect x="98" y="122" width="37" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
    <text x="116.5" y="137" class="c" text-anchor="middle">C++</text>
    <rect x="143" y="122" width="50" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
    <text x="168" y="137" class="c" text-anchor="middle">Wi-Fi</text>
    <rect x="201" y="122" width="37" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
    <text x="219.5" y="137" class="c" text-anchor="middle">BLE</text>
  </g>
</svg>
