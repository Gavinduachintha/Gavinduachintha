
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="168" viewBox="0 0 440 168" role="img" aria-label="WildLife AI - forest monitoring on a Raspberry Pi 5 with LoRa alerts">
  <style>
    .t { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 600; fill: #F5F7FA; }
    .k { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #FF9F43; letter-spacing: 0.14em; }
    .d { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; fill: #A7B0BC; }
    .c { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #65D6AD; }
  </style>

  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="#101318" stroke="#343B46" stroke-opacity="0.9"/>

  <text x="22" y="38" class="t">WildLife AI</text>
  <text x="418" y="36" class="k" text-anchor="end">EDGE AI · FIELD</text>

  <rect x="22" y="50" width="396" height="1" fill="#343B46"/>

  <text x="22" y="78" class="d">Forest monitoring on a Raspberry Pi 5: detection,</text>
  <text x="22" y="98" class="d">a GPS fix, and a LoRa alert with no network.</text>

  <g>
    <rect x="22" y="122" width="106" height="22" rx="5" fill="#65D6AD" fill-opacity="0.10" stroke="#65D6AD" stroke-opacity="0.25"/>
    <text x="75" y="137" class="c" text-anchor="middle">Raspberry Pi 5</text>

    <rect x="136" y="122" width="43" height="22" rx="5" fill="#FF9F43" fill-opacity="0.09" stroke="#FF9F43" stroke-opacity="0.25"/>
    <text x="157.5" y="137" class="k" text-anchor="middle">YOLO</text>

    <rect x="187" y="122" width="43" height="22" rx="5" fill="#65D6AD" fill-opacity="0.10" stroke="#65D6AD" stroke-opacity="0.25"/>
    <text x="208.5" y="137" class="c" text-anchor="middle">LoRa</text>

    <rect x="238" y="122" width="37" height="22" rx="5" fill="#65D6AD" fill-opacity="0.10" stroke="#65D6AD" stroke-opacity="0.25"/>
    <text x="256.5" y="137" class="c" text-anchor="middle">GPS</text>
  </g>
</svg>
