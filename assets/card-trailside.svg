
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="168" viewBox="0 0 440 168" role="img" aria-label="Trailside - an offline field guide built on open-weight models">
  <style>
    .t { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 600; fill: #F5F7FA; }
    .k { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #FF9F43; letter-spacing: 0.14em; }
    .d { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; fill: #A7B0BC; }
    .c { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #65D6AD; }
  </style>

  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="#101318" stroke="#343B46" stroke-opacity="0.9"/>

  <text x="22" y="38" class="t">Trailside</text>
  <text x="418" y="36" class="k" text-anchor="end">LOCAL AI · APP</text>

