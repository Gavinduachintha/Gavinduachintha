    <rect x="105" y="122" width="56" height="22" rx="5" fill="#FF9F43" fill-opacity="0.09" stroke="#FF9F43" stroke-opacity="0.25"/>
    <text x="133" y="137" class="k" text-anchor="middle">Ollama</text>

    <rect x="169" y="122" width="81" height="22" rx="5" fill="#65D6AD" fill-opacity="0.10" stroke="#65D6AD" stroke-opacity="0.25"/>
    <text x="209.5" y="137" class="c" text-anchor="middle">PostgreSQL</text>
