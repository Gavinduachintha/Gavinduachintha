<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Focus: Embedded and Edge - C, C++, Arduino, ESP32, Raspberry Pi. Applied Intelligence - Python, OpenCV, YOLO, TensorFlow, Edge Impulse. Software - TypeScript, React, Next.js, Go, Node, PostgreSQL.">
  <style><![CDATA[
    .n { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; fill: #5fbc8a; fill-opacity: 0.75; letter-spacing: 0.18em; }
    .h { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #f3f7f4; }
    .d { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; fill: #9fb0a8; }
    .c { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #5fbc8a; }
  ]]></style>

  <rect x="0.5" y="0.5" width="899" height="189" rx="12" fill="#0d1411" stroke="#5fbc8a" stroke-opacity="0.22"/>

  <!-- 01 Embedded and Edge -->
  <text x="22" y="28" class="n">01</text>
  <text x="22" y="50" class="h">Embedded &amp; Edge</text>
  <rect x="22" y="60" width="266" height="1" fill="#5fbc8a" fill-opacity="0.16"/>
  <text x="22" y="84" class="d">Hardware that keeps working</text>
  <text x="22" y="102" class="d">where the network cannot.</text>
  <rect x="22" y="120" width="24" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="34" y="135" class="c" text-anchor="middle">C</text>
  <rect x="53" y="120" width="37" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="71.5" y="135" class="c" text-anchor="middle">C++</text>
  <rect x="97" y="120" width="62" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="128" y="135" class="c" text-anchor="middle">Arduino</text>
  <rect x="166" y="120" width="50" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="191" y="135" class="c" text-anchor="middle">ESP32</text>
  <rect x="22" y="148" width="94" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="69" y="163" class="c" text-anchor="middle">Raspberry Pi</text>

  <!-- 02 Applied Intelligence -->
  <text x="316" y="28" class="n">02</text>
  <text x="316" y="50" class="h">Applied Intelligence</text>
  <rect x="316" y="60" width="266" height="1" fill="#5fbc8a" fill-opacity="0.16"/>
  <text x="316" y="84" class="d">Vision and models that run</text>
  <text x="316" y="102" class="d">on the device, not a cloud.</text>
  <rect x="316" y="120" width="56" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="344" y="135" class="c" text-anchor="middle">Python</text>
  <rect x="379" y="120" width="56" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="407" y="135" class="c" text-anchor="middle">OpenCV</text>
  <rect x="442" y="120" width="43" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="463.5" y="135" class="c" text-anchor="middle">YOLO</text>
  <rect x="316" y="148" width="81" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="356.5" y="163" class="c" text-anchor="middle">TensorFlow</text>
  <rect x="404" y="148" width="94" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="451" y="163" class="c" text-anchor="middle">Edge Impulse</text>

  <!-- 03 Software -->
  <text x="610" y="28" class="n">03</text>
  <text x="610" y="50" class="h">Software</text>
  <rect x="610" y="60" width="266" height="1" fill="#5fbc8a" fill-opacity="0.16"/>
  <text x="610" y="84" class="d">The interfaces and services</text>
  <text x="610" y="102" class="d">that make the hardware useful.</text>
  <rect x="610" y="120" width="81" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="650.5" y="135" class="c" text-anchor="middle">TypeScript</text>
  <rect x="698" y="120" width="50" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="723" y="135" class="c" text-anchor="middle">React</text>
  <rect x="755" y="120" width="62" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="786" y="135" class="c" text-anchor="middle">Next.js</text>
  <rect x="610" y="148" width="31" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="625.5" y="163" class="c" text-anchor="middle">Go</text>
  <rect x="648" y="148" width="43" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="669.5" y="163" class="c" text-anchor="middle">Node</text>
  <rect x="698" y="148" width="81" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
  <text x="738.5" y="163" class="c" text-anchor="middle">PostgreSQL</text>
</svg>
