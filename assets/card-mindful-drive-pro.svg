<svg xmlns="http://www.w3.org/2000/svg" width="440" height="168" viewBox="0 0 440 168" role="img" aria-label="Mindful Drive Pro - offline driver drowsiness detection on the Arduino UNO Q">
  <style><![CDATA[
    .t { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 600; fill: #f3f7f4; }
    .k { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #5fbc8a; letter-spacing: 0.14em; }
    .d { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; fill: #9fb0a8; }
    .c { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #5fbc8a; }
  ]]></style>
  <rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="#0d1411" stroke="#5fbc8a" stroke-opacity="0.22"/>
  <text x="22" y="38" class="t">Mindful Drive Pro</text>
  <text x="418" y="36" class="k" text-anchor="end">EDGE AI &#183; SAFETY</text>
  <rect x="22" y="50" width="396" height="1" fill="#5fbc8a" fill-opacity="0.16"/>
  <text x="22" y="78" class="d">Offline detection of driver drowsiness on the</text>
  <text x="22" y="98" class="d">Arduino UNO Q, with no cloud round trip.</text>
  <g>
    <rect x="22" y="122" width="100" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
    <text x="72" y="137" class="c" text-anchor="middle">Arduino UNO Q</text>
    <rect x="130" y="122" width="94" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
    <text x="177" y="137" class="c" text-anchor="middle">Edge Impulse</text>
    <rect x="232" y="122" width="56" height="22" rx="5" fill="#5fbc8a" fill-opacity="0.1"/>
    <text x="260" y="137" class="c" text-anchor="middle">Python</text>
  </g>
</svg>
